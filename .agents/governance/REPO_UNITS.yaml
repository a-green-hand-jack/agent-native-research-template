schema_version: 1

units:
  governance:
    purpose: reduce the cost and risk of directing, coordinating, validating, and maintaining the project
    physical_boundary: .agents/
    change_test: the change alters how agent work is oriented, constrained, coordinated, verified, or retained
  functional:
    purpose: implement, execute, evaluate, and communicate the project outcome
    physical_boundary: repository paths outside the governance sidecar
    change_test: the change advances or supports the capability, experiment, benchmark, environment, or claim

ownership:
  default: functional
  governance_paths:
    - .agents/
    - AGENTS.md

required_paths:
  governance:
    - .agents/governance/ANATOMY.md
    - .agents/governance/CONTRACT.md
    - .agents/governance/GUIDE.md
    - .agents/governance/REPO_UNITS.yaml
    - .agents/governance/docs/worktree-control.html
    - .agents/governance/tools/repo_check.py
    - .agents/memory/INDEX.md
    - .agents/runtime/.gitignore
    - .agents/skills/
    - AGENTS.md
  functional:
    - README.md
    - CONTRIBUTIONS.md
    - configs/base.yaml
    - environments/main.yaml
    - evals/smoke.yaml
    - experiments/specs/smoke.yaml
    - infra/profiles/local.yaml
    - Makefile
    - pyproject.toml
    - src/
    - tests/

dependency_rules:
  - from: functional
    to: governance
    allowed: false
    reason: project behavior and evidence must remain usable without the governance sidecar
  - from: governance
    to: functional
    allowed: true
    reason: governance may read, invoke, and validate declared project interfaces without changing their runtime

adapters:
  - path: AGENTS.md
    purpose: agent-tool discovery
    invasive: false
  - path: .github/workflows/verify.yml
    purpose: run project verification and governance validation as independent CI jobs
    invasive: false
