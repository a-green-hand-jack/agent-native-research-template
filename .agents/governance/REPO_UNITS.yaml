schema_version: 1
units:
  governance:
    purpose: reduce the cost and risk of directing, coordinating, validating, and
      maintaining the project
    physical_boundary: .agents/
    change_test: the change alters how agent work is oriented, constrained, coordinated,
      verified, or retained
  functional:
    purpose: implement, execute, evaluate, and communicate the project outcome
    physical_boundary: repository paths outside the governance sidecar
    change_test: the change advances or supports the capability, experiment, benchmark,
      environment, or claim
ownership:
  default: functional
  governance_paths:
  - .agents/
  - AGENTS.md
required_paths:
  governance:
  - .agents/governance/ANATOMY.md
  - .agents/governance/CONTRACT.md
  - .agents/governance/GUIDE.md
  - .agents/governance/INFLUENCES.md
  - .agents/governance/REPO_UNITS.yaml
  - .agents/governance/docs/worktree-control.html
  - .agents/governance/tools/repo_check.py
  - .agents/memory/INDEX.md
  - .agents/runtime/.gitignore
  - .agents/skills/
  - .agents/skills/adopt-research-template/SKILL.md
  - .agents/skills/dev-guide/SKILL.md
  - .agents/skills/initialize-project/SKILL.md
  - .agents/skills/update-from-template/SKILL.md
  - AGENTS.md
  functional:
  - .github/dependabot.yml
  - .github/pull_request_template.md
  - CONTRIBUTIONS.md
  - LICENSE
  - Makefile
  - PROJECT.yaml
  - README.md
  - SECURITY.md
  - archives/.gitignore
  - archives/README.md
  - assets/registry.yaml
  - configs/base.yaml
  - docs/ARCHIVE_RETIREMENT.md
  - docs/ASSET_BINDINGS.md
  - docs/EXPERIMENT_PLANS.md
  - docs/INPUT_IDENTITY.md
  - docs/METRIC_OBSERVATIONS.md
  - docs/PHASE_RECOVERY.md
  - docs/REFERENCE_IMPLEMENTATION.md
  - docs/RELEASE_LIFECYCLE.md
  - docs/RUN_STATUS.md
  - docs/TEMPLATE_LIFECYCLE.md
  - environments/main.yaml
  - evals/smoke.yaml
  - evidence/manifests/README.md
  - external-facts/README.md
  - experiments/specs/smoke.yaml
  - infra/profiles/local.yaml
  - pyproject.toml
  - schemas/archive-manifest.schema.json
  - schemas/asset-registry.schema.json
  - schemas/environment.schema.json
  - schemas/evaluation.schema.json
  - schemas/evidence-manifest.schema.json
  - schemas/external-fact.schema.json
  - schemas/executor.schema.json
  - schemas/experiment.schema.json
  - schemas/run-manifest.schema.json
  - schemas/run-result.schema.json
  - schemas/release-manifest.schema.json
  - schemas/release.schema.json
  - schemas/template-plan.schema.json
  - src/
  - tests/
  - tools/archive.py
  - tools/__init__.py
  - tools/asset_binding.py
  - tools/ci_policy.py
  - tools/control_cli.py
  - tools/evidence.py
  - tools/execution_environment.py
  - tools/external_facts.py
  - tools/experiment_plan.py
  - tools/initialize_project.py
  - tools/input_identity.py
  - tools/metric_observation.py
  - tools/phase_graph.py
  - tools/plan_identity.py
  - tools/research.py
  - tools/release.py
  - tools/run_state.py
  - tools/template_compat.py
  - tools/template_lifecycle.py
  - tools/verify_template_e2e.py
dependency_rules:
- from: functional
  to: governance
  allowed: false
  reason: project behavior and evidence must remain usable without the governance
    sidecar
- from: governance
  to: functional
  allowed: true
  reason: governance may read, invoke, and validate declared project interfaces without
    changing their runtime
adapters:
- path: AGENTS.md
  purpose: agent-tool discovery
  invasive: false
- path: .gitignore
  purpose: keep template-owned and tool-owned runtime state outside tracked repository
    units
  invasive: false
- path: .github/workflows/verify.yml
  purpose: run project verification and governance validation as independent CI jobs
  invasive: false
