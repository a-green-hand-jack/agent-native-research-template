name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  project:
    name: Project / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync environment
        run: uv sync --frozen --group dev

      - name: Verify project and research specifications
        run: make verify

  integration:
    name: Integration / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.11"

      - name: Sync environment
        run: uv sync --frozen --group dev

      - name: Execute the smallest research loop
        run: make research-run

      - name: Initialize and verify a real project copy
        run: make template-e2e

      - name: Verify the project without governance
        run: |
          rm -rf .agents AGENTS.md .venv
          uv sync --frozen --group dev
          make verify

  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"

      - name: Validate optional governance sidecar
        run: uv run --no-project --with pyyaml python .agents/governance/tools/repo_check.py

  read_experiment_notes:
    name: Read public experiment notes
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and print the public Gist
        run: |
          python - <<'PY'
          import json
          import urllib.request

          gist_url = "https://api.github.com/gists/1176c9ee76127c32f03f5cac37fb2961"
          request = urllib.request.Request(
              gist_url,
              headers={"Accept": "application/vnd.github+json", "User-Agent": "template-audit"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              gist = json.load(response)
          for filename, record in sorted(gist["files"].items()):
              content = record.get("content", "")
              if record.get("truncated"):
                  raw_request = urllib.request.Request(
                      record["raw_url"], headers={"User-Agent": "template-audit"}
                  )
                  with urllib.request.urlopen(raw_request, timeout=30) as response:
                      content = response.read().decode("utf-8")
              print(f"===== BEGIN {filename} =====")
              print(content)
              print(f"===== END {filename} =====")
          PY
