name: Verify

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/configurable-installed-cli
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.11'

      - name: Apply scoped integration
        run: |
          python tools/integrate_control_cli.py
          uv lock
          uv sync --frozen --group dev
          uv run ruff check --fix .
          uv run ruff format .
          uv run pytest -q
          uv run researchctl --help
          uv run researchctl experiment plan experiments/specs/smoke.yaml >/dev/null
          rm -f .github/workflows/integrate-control-cli.yml
          git show origin/main:.github/workflows/verify.yml > .github/workflows/verify.yml

      - name: Commit integrated control surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate configurable installed CLI"
          git push origin HEAD:agent/configurable-installed-cli
