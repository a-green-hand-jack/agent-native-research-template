name: Verify

on:
  pull_request:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out integration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/effective-config-only
          fetch-depth: 0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: '3.11'

      - name: Apply contract fixes
        run: |
          python tools/fix_effective_config_contracts.py
          uv sync --frozen --group dev
          uv run ruff format .
          uv run ruff check .
          uv run pytest -q
          make research-run
          uv run --no-project --with pyyaml python .agents/governance/tools/repo_check.py
          git show origin/main:.github/workflows/verify.yml > .github/workflows/verify.yml

      - name: Commit contract fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align effective configuration contracts"
          git push origin HEAD:agent/effective-config-only
