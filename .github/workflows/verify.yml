name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --frozen --group dev

      - name: Verify project and research specifications
        run: make verify

      - name: Execute the smallest research loop
        run: make research-run

      - name: Verify the project without governance
        run: |
          rm -rf .agents AGENTS.md .venv
          uv sync --frozen --group dev
          make verify

  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Validate optional governance sidecar
        run: uv run --no-project --with pyyaml python .agents/governance/tools/repo_check.py
