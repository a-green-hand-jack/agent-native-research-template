name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  project:
    name: Project / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync environment
        run: uv sync --frozen --group dev

      - name: Verify project and research specifications
        run: make verify

  integration:
    name: Integration / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync environment
        run: uv sync --frozen --group dev

      - name: Execute the smallest research loop
        run: make research-run

      - name: Initialize and verify a real project copy
        run: make template-e2e

      - name: Verify the project without governance
        run: |
          rm -rf .agents AGENTS.md .venv
          uv sync --frozen --group dev
          make verify

  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"

      - name: Validate optional governance sidecar
        run: uv run --no-project --with pyyaml python .agents/governance/tools/repo_check.py
