name: Integrate deterministic plan

on:
  pull_request:
    paths:
      - tools/apply_plan_patch.py
      - tools/experiment_plan.py
      - tests/test_experiment_plan.py
      - docs/EXPERIMENT_PLANS.md
      - .github/workflows/integrate-plan.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: agent/deterministic-experiment-plans

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"

      - name: Apply and format scoped integration
        run: |
          uv sync --frozen --group dev
          sed -i 's/: false/: False/g' tools/apply_plan_patch.py
          uv run python tools/apply_plan_patch.py
          uv run ruff format tools tests
          rm tools/apply_plan_patch.py
          rm .github/workflows/integrate-plan.yml

      - name: Validate integrated branch
        run: |
          make verify
          make research-run
          make template-e2e
          uv run --no-project --with pyyaml python .agents/governance/tools/repo_check.py

      - name: Commit integrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate deterministic experiment planning"
          git push origin HEAD:agent/deterministic-experiment-plans
