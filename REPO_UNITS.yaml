schema_version: 1

units:
  governance:
    purpose: reduce the cost and risk of changing, coordinating, validating, and maintaining the project
    change_test: the change alters how work is directed, constrained, verified, integrated, or retained
  functional:
    purpose: implement, execute, evaluate, and communicate the project outcome
    change_test: the change advances or supports the capability, experiment, benchmark, environment, or claim

ownership:
  default: functional
  governance_paths:
    - .agents/
    - .github/
    - .gitignore
    - .pre-commit-config.yaml
    - AGENTS.md
    - ANATOMY.md
    - CONTRACT.md
    - GUIDE.md
    - Makefile
    - REPO_UNITS.yaml
    - docs/governance/
    - tools/repo_check.py

required_paths:
  governance:
    - .agents/memory/INDEX.md
    - .agents/runtime/.gitignore
    - .agents/skills/
    - .github/workflows/verify.yml
    - AGENTS.md
    - ANATOMY.md
    - CONTRACT.md
    - GUIDE.md
    - Makefile
    - REPO_UNITS.yaml
    - tools/repo_check.py
  functional:
    - README.md
    - CONTRIBUTIONS.md
    - configs/base.yaml
    - environments/main.yaml
    - evals/smoke.yaml
    - experiments/specs/smoke.yaml
    - infra/profiles/local.yaml
    - pyproject.toml
    - src/
    - tests/

dependency_rules:
  - from: functional
    to: governance
    allowed: false
    reason: project behavior and evidence must remain usable without agent runtime or governance state
  - from: governance
    to: functional
    allowed: true
    reason: governance may inspect, invoke, and validate the project through its public interfaces
